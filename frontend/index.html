<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomalies in WBAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    
    <link rel ="stylesheet" href="./css/style.css">
  </head>
  
  
  <body>
  
    <!-- Title -->
    <section id="title" class="gradient-background">
      <div class="container col-xxl-8 px-4 pt-5">
        <div class="row flex-lg-row-reverse align-items-center g-5 pt-5">
            <div class="col-10 col-sm-8 col-lg-6">
                <img src="./assets/health.png" class="d-block mx-lg-auto img-fluid" alt="Bootstrap Themes" height="200" loading="lazy">
              </div>
          <div class="col-lg-6">
            <h1 class="center display-5 fw-bold text-body-emphasis lh-1 mb-3">Enter your information</h1>
          </div>
        </div>
      </div>
  
  
    </section>

    <section>
        <div class="container mt-5">
          <div class="row g-4 py-5 row-cols-1 row-cols-md-4">
            
            <!-- Heart Rate Column -->
            <div class="col d-flex align-items-start">
              <div class="icon-square text-body-emphasis bg-body-secondary d-inline-flex align-items-center justify-content-center flex-shrink-0 me-3" style="width: 64px; height: 64px; border-radius: 12px;">
                <img src="./assets/hr.png" alt="Heart rate" style="width: 100%; height: 100%; object-fit: contain;">
              </div>
              <form>
                <div class="form-group">
                  <label for="heartRateInput">Heart Rate</label>
                  <input type="text" class="form-control" id="heartRateInput" placeholder="Enter Heart Rate">
                </div>
              </form>
            </div>
      
            <!-- Temperature Column -->
            <div class="col d-flex align-items-start">
              <div class="icon-square text-body-emphasis bg-body-secondary d-inline-flex align-items-center justify-content-center flex-shrink-0 me-3" style="width: 64px; height: 64px; border-radius: 12px;">
                <img src="./assets/temp.jpg" alt="Temperature" style="width: 100%; height: 100%; object-fit: contain;">
              </div>
              <form>
                <div class="form-group">
                  <label for="tempInput">Temperature</label>
                  <input type="text" class="form-control" id="tempInput" placeholder="Enter Temperature">
                </div>
              </form>
            </div>
            <div class="col d-flex align-items-start">
                <div class="icon-square text-body-emphasis bg-body-secondary d-inline-flex align-items-center justify-content-center flex-shrink-0 me-3" style="width: 64px; height: 64px; border-radius: 12px;">
                  <img src="./assets/reso_rate.png" alt="Temperature" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <form>
                  <div class="form-group">
                    <label for="tempInput">Respiratory Rate</label>
                    <input type="text" class="form-control" id="tempInput" placeholder="Enter Respiratory Rate">
                  </div>
                </form>
              </div>
              <div class="col d-flex align-items-start">
                <div class="icon-square text-body-emphasis bg-body-secondary d-inline-flex align-items-center justify-content-center flex-shrink-0 me-3" style="width: 64px; height: 64px; border-radius: 12px;">
                  <img src="./assets/spo2.jpg" alt="Temperature" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <form>
                  <div class="form-group">
                    <label for="tempInput">Spo2</label>
                    <input type="text" class="form-control" id="tempInput" placeholder="Enter Spo2">
                  </div>
                </form>
              </div>

              <div class=" my-5 g-4 col d-flex align-items-start">
                <div class="icon-square text-body-emphasis bg-body-secondary d-inline-flex align-items-center justify-content-center flex-shrink-0 me-3" style="width: 64px; height: 64px; border-radius: 12px;">
                  <img src="./assets/ABPs.png" alt="Temperature" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <form>
                  <div class="form-group">
                    <label for="tempInput">ABPs</label>
                    <input type="text" class="form-control" id="tempInput" placeholder="Enter ABPs">
                  </div>
                </form>
              </div>
              <div class="my-5 g-4 col d-flex align-items-start ">
                <div class="icon-square text-body-emphasis bg-body-secondary d-inline-flex align-items-center justify-content-center flex-shrink-0 me-3" style="width: 64px; height: 64px; border-radius: 12px;">
                  <img src="./assets/ABPd.png" alt="Temperature" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <form>
                  <div class="form-group">
                    <label for="tempInput">ABPd</label>
                    <input type="text" class="form-control" id="tempInput" placeholder="Enter ABPd">
                  </div>
                </form>
              </div>
              <div class=" my-5 g-4 col d-flex align-items-start">
                <div class="icon-square text-body-emphasis bg-body-secondary d-inline-flex align-items-center justify-content-center flex-shrink-0 me-3" style="width: 64px; height: 64px; border-radius: 12px;">
                  <img src="./assets/ABPm.png" alt="Temperature" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <form>
                  <div class="form-group">
                    <label for="tempInput">ABPm</label>
                    <input type="text" class="form-control" id="tempInput" placeholder="Enter ABPm">
                  </div>
                </form>
                
              </div>
              
          </div>
          <div class="d-flex justify-content-center my-4">
            <button type="submit" class="btn gradient-background w-50">Submit</button>
          </div>
          
        </div>

      </section>
      

    
</body>
</html>
